<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    
    <h1>Tic Tac Toe</h1>  
    <div>
        <input type="text" id="player1" value="Player1">
        <input type="text" id="player2" value="Player2">
        <button id="resetBtn">Start Game</button>
    </div>
    <h2 id="status">Please enter player names and press start.  Starting player will be randomized.</h2>
    <div id="board"></div>
    
</body>
</html>
